# Base Hyprland config -- copy to ~/.config/hypr/hyprland.conf
#
# Look-and-feel, input tuning, animation curves and the tiling keybind layout
# are ported from Omarchy's (basecamp/omarchy) actual default config values.
# Omarchy 4.x itself configures Hyprland through a Lua framework whose
# bindings call ~30 "omarchy-*" helper scripts and a custom Quickshell app --
# none of that exists outside a full Omarchy install, so this file re-creates
# the same behaviour with plain Hyprland syntax and standalone tools
# (wofi, grim/slurp/swappy, cliphist, wpctl, brightnessctl) instead.
#
# Everything below is a starting point -- edit freely. See
# https://wiki.hyprland.org for the full option reference.

# ------------------------------------------------------------------------
# Monitors -- "preferred,auto,auto" mirrors Omarchy's default: preferred
# mode, auto placement, auto (per-display) scale. Run `hyprctl monitors all`
# to see connected outputs, then add specific lines like:
# monitor = DP-2, 2560x1440@144, 0x0, 1
# ------------------------------------------------------------------------
monitor = , preferred, auto, auto

# ------------------------------------------------------------------------
# Autostart
# ------------------------------------------------------------------------
exec-once = systemctl --user import-environment PATH XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd --all

# Quickshell's Qt6 build can't get an EGL context on this GPU/driver combo
# (QRhiGles2 fails to create a context, "EGL not available") even though
# Hyprland itself renders fine -- likely a packaging issue specific to the
# unstable.quickshell Qt closure. Force Qt Quick's CPU-only renderer instead;
# a status bar doesn't need GPU acceleration. QSG_RHI_BACKEND=software does
# NOT work here (that variable only selects among GPU RHI backends in Qt6 --
# vulkan/d3d11/d3d12/metal/opengl/null); QT_QUICK_BACKEND=software is the
# actual switch to the legacy CPU QPainter-based Quick renderer.
env = QT_QUICK_BACKEND,software
exec-once = qs
exec-once = hyprpaper
# hypridle is NOT launched here -- programs.hyprlock.enable in
# import-05-desktop-hyprland.nix already runs it as a systemd --user
# service (services.hypridle.enable), auto-started by
# graphical-session.target. Launching it again here raced with that and
# just failed on the second instance.
exec-once = polkit-agent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ------------------------------------------------------------------------
# Env vars (from Omarchy's default/hypr/envs.lua)
# ------------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Explicit theme -- only Adwaita is actually installed on this system.
# NOTE: ~/.config/gtk-3.0 and gtk-4.0/settings.ini and dconf's
# org.gnome.desktop.interface are shared with GNOME (not per-session), so
# picking an uninstalled theme in nwg-look breaks GNOME's cursor too.
env = XCURSOR_THEME,Adwaita
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# ------------------------------------------------------------------------
# Look and feel (values as shipped in Omarchy's default/hypr/looknfeel.lua)
# ------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear, 0, 0, 1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
bezier = quick, 0.15, 0, 0.1, 1

animations {
    enabled = true
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = fadeSwitch, 0
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0
}

dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    initial_workspace_tracking = 0
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

binds {
    hide_special_on_workspace_change = true
}

# ------------------------------------------------------------------------
# Input (from Omarchy's default/hypr/input.lua). kb_layout matches this
# machine's console/X11 keymap set in import-03-i18s.nix.
# ------------------------------------------------------------------------
input {
    kb_layout = es
    kb_variant =
    kb_options = compose:caps
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true
    natural_scroll = true

    touchpad {
        natural_scroll = false
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

# ------------------------------------------------------------------------
# Window rules (from Omarchy's default/hypr/windows.lua, minus the
# app-specific overrides that lived in default/hypr/apps/*).
#
# Hyprland overhauled windowrule syntax in 0.53+ and again as part of the
# 0.55 move to a Lua-backed config engine: selectors now need an explicit
# "match:<prop>" prefix and effects use the same snake_case names as the
# Lua window_rule() API (see https://wiki.hypr.land/Configuring/Basics/Window-Rules/,
# which now documents the Lua form -- this is its classic-conf mirror).
# ------------------------------------------------------------------------
windowrule = match:class .*, suppress_event maximize
windowrule = match:class .*, opacity 0.985 0.96
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on

# ------------------------------------------------------------------------
# Variables
# ------------------------------------------------------------------------
$terminal = kitty
$browser = firefox
$fileManager = thunar
$menu = wofi --show drun

# ------------------------------------------------------------------------
# Core bindings
#
# These use `bindd` (bind-with-description) rather than plain `bind` so
# SUPER + K can show a searchable list of them -- the description is what
# shows up there and in `hyprctl binds`. Variants: d+e = repeating,
# d+e+l = repeating and works while locked, d+l = works while locked.
# Mouse binds can't take a description, so they stay as plain `bindm`.
# Descriptions must not contain commas (the fields are comma-separated).
# ------------------------------------------------------------------------
bindd = SUPER, K, Show keybindings, exec, hypr-keybinds
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, F, File manager, exec, $fileManager
bindd = SUPER, SPACE, Application launcher, exec, $menu
bindd = SUPER, Q, Close window, killactive
bindd = SUPER, W, Close window, killactive
bindd = SUPER, V, Toggle floating/tiling, togglefloating
bindd = SUPER, P, Pseudotile window, pseudo
bindd = SUPER, J, Toggle split direction, layoutmsg, togglesplit
bindd = SUPER, F, Fullscreen, fullscreen, 0
bindd = SUPER ALT, F, Maximize (keep bar), fullscreen, 1
bindd = SUPER, ESCAPE, Lock screen, exec, hyprlock
bindd = SUPER SHIFT, ESCAPE, Exit Hyprland, exit
# hypridle's before_sleep_cmd locks the session on the way down, so this
# doesn't need to call hyprlock itself.
bindd = SUPER CTRL, ESCAPE, Suspend machine, exec, systemctl suspend

# Clipboard manager (cliphist)
bindd = SUPER CTRL, V, Clipboard history, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Focus movement
bindd = SUPER, left, Focus window left, movefocus, l
bindd = SUPER, right, Focus window right, movefocus, r
bindd = SUPER, up, Focus window up, movefocus, u
bindd = SUPER, down, Focus window down, movefocus, d

# Swap windows
bindd = SUPER SHIFT, left, Swap window left, swapwindow, l
bindd = SUPER SHIFT, right, Swap window right, swapwindow, r
bindd = SUPER SHIFT, up, Swap window up, swapwindow, u
bindd = SUPER SHIFT, down, Swap window down, swapwindow, d

# Resize windows
bindde = SUPER CTRL, left, Shrink window horizontally, resizeactive, -20 0
bindde = SUPER CTRL, right, Grow window horizontally, resizeactive, 20 0
bindde = SUPER CTRL, up, Shrink window vertically, resizeactive, 0 -20
bindde = SUPER CTRL, down, Grow window vertically, resizeactive, 0 20

# Workspaces 1-10
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10

bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Last used workspace, workspace, previous

# Scratchpad
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER SHIFT, S, Move window to scratchpad, movetoworkspace, special:scratchpad

# Mouse move/resize
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Scroll through workspaces. Note input:natural_scroll = true inverts the
# wheel, so swap these two lines if the direction feels backwards.
bindd = SUPER, mouse_down, Next workspace (scroll), workspace, e+1
bindd = SUPER, mouse_up, Previous workspace (scroll), workspace, e-1

# Screenshots (grim + slurp + swappy)
bindd = , PRINT, Screenshot region, exec, grim -g "$(slurp)" - | swappy -f -
bindd = SUPER, PRINT, Screenshot full screen, exec, grim - | swappy -f -
bindd = SUPER SHIFT, PRINT, Screenshot to file, exec, mkdir -p ~/Imágenes/Screenshots && grim ~/Imágenes/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Media / volume / brightness (wpctl -- this machine uses pipewire, no pulseaudio)
binddel = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binddel = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binddel = , XF86AudioMute, Mute output, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binddel = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binddel = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set 5%+
binddel = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous
binddl = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
