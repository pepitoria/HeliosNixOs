# Copy to ~/.config/hypr/hyprlock.conf
# Colors match the accent gradient used in hyprland.conf (cyan -> green).

general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    outer_color = rgba(33ccffee)
    inner_color = rgba(20, 20, 20, 0.8)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = monospace
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = monospace
    position = 0, 60
    halign = center
    valign = center
}
