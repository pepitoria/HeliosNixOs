# Copy to ~/.config/hypr/hyprpaper.conf
#
# Note: hyprpaper 0.8.x replaced the old "preload = ..." / "wallpaper = ,path"
# one-liner syntax with these wallpaper{} blocks. The old form silently does
# nothing on this version.

splash = false
ipc = on

# path accepts a directory, so hyprpaper does the random picking itself --
# no script needed. timeout is how often it rotates to another image; the
# long value here means it effectively picks one random wallpaper at login
# and keeps it for the session. Drop it to e.g. 1800 to rotate every 30min
# (it defaults to 30 SECONDS if omitted, which is very aggressive).
wallpaper {
    monitor =
    path = ~/Imágenes/BingWallpaper
    fit_mode = cover
    order = random
    timeout = 86400
}
